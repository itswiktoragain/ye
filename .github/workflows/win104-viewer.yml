name: Windows 1.04 SDK Compatibility Build

on:
  push:
    branches:
      - agent/win104-image-viewer
    paths:
      - "win104-viewer/**"
      - ".github/workflows/win104-viewer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-win1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install native 8086 Windows 1.x compiler
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/ow-linux \
            https://github.com/open-watcom/open-watcom-v2/releases/download/Current-build/open-watcom-2_0-c-linux-x64
          mkdir -p "$HOME/watcom"
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          7z x -y -o"$HOME/watcom" /tmp/ow-linux >/dev/null
          chmod -R u+rx "$HOME/watcom/binl64" "$HOME/watcom/binl"

      - name: Compile Windows 1.01-SDK-style applications
        shell: bash
        run: |
          set -euxo pipefail
          export WATCOM="$HOME/watcom"
          export EDPATH="$WATCOM/eddat"
          export INCLUDE="$WATCOM/h;$WATCOM/h/win"
          export PATH="$WATCOM/binl64:$WATCOM/binl:$PATH"
          cd win104-viewer
          # 8086 Windows1, independent SS/DS, explicit callback DGROUP reload.
          # -s disables Watcom stack checker, which otherwise calls before
          # __loadds has restored DS in an exported Windows 1.x WndProc.
          flags="-bt=windows -ms -0 -zu -zw -bg -s -nt=_TEXT -dWINVER=0x0100 -wx -we -zq"
          wcc $flags -fo=sdkprobe.obj sdkprobe.c
          wrc -q -r -10 -bt=windows -fo=win104picker.res win104picker.rc
          # PicoJPEG by Rich Geldreich, public domain / MIT, pinned source.
          curl -fsSL --retry 3 -o picojpeg.c https://raw.githubusercontent.com/richgel999/picojpeg/8ab33a909b4115ace4a952b7ffcb64c350f9298d/picojpeg.c
          curl -fsSL --retry 3 -o picojpeg.h https://raw.githubusercontent.com/richgel999/picojpeg/8ab33a909b4115ace4a952b7ffcb64c350f9298d/picojpeg.h
          # PicoJPEG's historical (-1)<<n masks are undefined C signed shifts.
          # Correct to an equivalent defined long arithmetic expression.
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("picojpeg.c")
          data=p.read_text()
          data,n=re.subn(r'\(\(-1\)<<(\d+)\) \+ 1',
                         lambda m: f'(1L - (1L << {m.group(1)}))',data)
          assert n==15, f'Unexpected picojpeg shift source: {n}'
          # Watcom real-mode Windows puts stack locals in SS, not DS.
          # These address-taken locals must be static or the tiny decoder
          # would truncate SS pointers passed to its near-pointer helpers.
          fixes=[
              ("readDHTMarker", "uint8 bits[16]"),
              ("locateSOFMarker", "uint8 c"),
              ("locateSOSMarker", "uint8 c"),
              ("findEOI", "uint8 c"),
              ("initScan", "uint8 foundEOI"),
          ]
          for func,decl in fixes:
              pattern=r'(static uint8 '+func+r'\([^)]*\)\s*\{\s*)'+re.escape(decl)+r';'
              data,n=re.subn(pattern,lambda m: m.group(1)+'static '+decl+';',data)
              assert n==1, f'PicoJPEG SS/DS static pointer repair failed for {func}: {n}'

          p.write_text(data)
          PY
          wcc $flags -fo=win104picker.obj win104picker.c
          wcc $flags -fo=codecs.obj codecs.c
          wcc $flags -fo=codec_jpeg.obj codec_jpeg.c
          wcc $flags -fo=codec_png.obj codec_png.c
          wcc $flags -fo=codec_webp.obj codec_webp.c
          wcc -bt=windows -ms -0 -zu -zw -bg -s -nt=_TEXT -dWINVER=0x0100 -zq -fo=picojpeg.obj picojpeg.c
          wcc $flags -fo=minwin.obj minwin.c

          cat > sdkprobe.lnk <<'LINK'
          system windows1
          name SDKPROBE.EXE
          file sdkprobe.obj
          EXPORT SdkProbeProc.1 PRIVATE RESIDENT
          segment TYPE CODE MOVEABLE
          segment TYPE DATA MOVEABLE
          option stack=4096
          option heapsize=1024
          option map=SDKPROBE.MAP
          LINK
          wlink @sdkprobe.lnk

          cat > sdkviewer.lnk <<'LINK'
          system windows1
          name CHRONO.EXE
          file win104picker.obj
          file codecs.obj
          file codec_jpeg.obj
          file codec_png.obj
          file codec_webp.obj
          file picojpeg.obj
          EXPORT ChronoWndProc.1 PRIVATE RESIDENT
          EXPORT ChronoOpenDlgProc.2 PRIVATE RESIDENT
          segment TYPE CODE MOVEABLE
          segment TYPE DATA MOVEABLE
          option stack=6144
          option heapsize=2048
          option map=CHRONO.MAP
          option resource=win104picker.res
          LINK
          wlink @sdkviewer.lnk

          cat > minwin.lnk <<'LINK'
          system windows1
          name MINWIN.EXE
          file minwin.obj
          segment TYPE CODE MOVEABLE
          segment TYPE DATA MOVEABLE
          option stack=4096
          option heapsize=1024
          option map=MINWIN.MAP
          LINK
          wlink @minwin.lnk

          file SDKPROBE.EXE CHRONO.EXE MINWIN.EXE
          ls -lh SDKPROBE.EXE CHRONO.EXE MINWIN.EXE

      - name: Run actual PNG and JPEG decoder regression tests
        shell: bash
        run: |
          set -euxo pipefail
          cd win104-viewer
          python3 -m venv /tmp/chrono-pil
          /tmp/chrono-pil/bin/pip -q install pillow
          /tmp/chrono-pil/bin/python tests/make_fixtures.py
          cc -std=c99 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer \
             -Itests -I. tests/hostcodec.c codecs.c codec_png.c codec_jpeg.c \
             picojpeg.c -o /tmp/chronocodec-test
          ASAN_OPTIONS=detect_leaks=1 /tmp/chronocodec-test \
             png tests/fixtures/rgb.png 1600 \
             png tests/fixtures/indexed.png 1920 \
             png tests/fixtures/stored.png 0 \
             png tests/fixtures/rgba.png 0 \
             jpg tests/fixtures/baseline.jpg -1

      - name: Verify Win1 module imports and NE formats
        run: |
          set -euo pipefail
          python3 win104-viewer/verify_ne.py win104-viewer/SDKPROBE.EXE
          python3 win104-viewer/verify_ne.py win104-viewer/CHRONO.EXE
          python3 win104-viewer/verify_picker.py win104-viewer/CHRONO.EXE
          python3 - <<'PY'
          from pathlib import Path
          b=Path("win104-viewer/CHRONO.EXE").read_bytes()
          ne=int.from_bytes(b[0x3c:0x40],"little")
          assert b[ne:ne+2]==b"NE"
          resource_table=ne+int.from_bytes(b[ne+0x24:ne+0x26],"little")
          resource_end=ne+int.from_bytes(b[ne+0x26:ne+0x28],"little")
          assert resource_end>resource_table+8, "Missing Win1 native Open-dialog resources"
          print("CHECK PASSED: Win1 resource table found")
          PY
          python3 win104-viewer/verify_ne.py win104-viewer/MINWIN.EXE
          python3 - <<'PY'
          from pathlib import Path
          m=Path("win104-viewer/CHRONO.MAP").read_text().lower()
          forbidden=("fopen.c", "fread.c", "fgetc.c", "freopen.c",
                     "opendos.c", "_dos_open_", "_dos_creat_",
                     "sopen_", "___iob", "getche.c")
          found=[name for name in forbidden if name in m]
          assert not found, f"DOS-oriented CRT file routines linked: {found}"
          print("CHECK PASSED: no DOS-oriented stdio/file handlers in CHRONO.EXE")
          PY

      - name: Make small 1985-compatible test picture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          w,h=96,64
          data=bytes((x//6+(y//8)*2)%16 for y in range(h) for x in range(w))
          Path("win104-viewer/IMAGE.CV1").write_bytes(
              b"CV1\x1a"+w.to_bytes(2,"little")+h.to_bytes(2,"little")+data)
          PY
          cp win104-viewer/tests/fixtures/rgb.png win104-viewer/COLOR.PNG
          cp win104-viewer/tests/fixtures/baseline.jpg win104-viewer/PHOTO.JPG
          cat > win104-viewer/INSTALL.TXT <<'TXT'
          ChronoView: direct PNG and JPEG decoding for Windows 1.04

          This experimental native 8086 EXE opens actual PNG and
          baseline JPEG images from the DOS filesystem. No companion
          converter or host process is used for these formats.

          1. Copy CHRONO.EXE, COLOR.PNG and PHOTO.JPG into C:\\.
          2. Boot Windows 1.04 from a clean, disposable VM snapshot.
          3. Run CHRONO.EXE. It begins with a white image canvas.
          4. In the top-left title-bar system menu, choose Open...
          5. Open COLOR.PNG to test native PNG decoding and PHOTO.JPG
             to test native baseline JPEG. They use actual compressed
             PNG/JPEG bytes, NOT preconverted CV1 images.
          6. Open other PNG/JPEG files by their real filenames. The app
             downsamples to at most 128x128 EGA/16 colors.
             Very large images can take a long time on an 8086 CPU.
          7. WebP is recognized, but VP8/VP8L decoding is NOT included
             in this version; an explicit error is displayed. Do not
             rename WebP to PNG and expect decoding.

          PNG support: non-interlaced (no Adam7) color types 0/2/3/4/6,
          standard 1/2/4/8/16 bit depths, transparency, DEFLATE.
          JPEG support: baseline grayscale and YCbCr, not progressive.
          Animated formats and APNG animations are not supported.

          Real image decoding is regression-tested on Linux against
          PNG and JPEG sample files using the identical decoder code.
          GitHub also compiles native 16-bit NE and validates imports,
          startup callback data-segment relocations, and image dialog.
          Windows 1.04 emulator execution is NOT independently verified.
          Always use a disposable VM snapshot for testing.
          TXT

      - uses: actions/upload-artifact@v4
        with:
          name: CHRONOVIEW-104-NATIVE-PNG-JPEG
          path: |
            win104-viewer/MINWIN.EXE
            win104-viewer/SDKPROBE.EXE
            win104-viewer/CHRONO.EXE
            win104-viewer/IMAGE.CV1
            win104-viewer/COLOR.PNG
            win104-viewer/PHOTO.JPG
            win104-viewer/INSTALL.TXT
            win104-viewer/SDKPROBE.MAP
            win104-viewer/CHRONO.MAP
          if-no-files-found: error
