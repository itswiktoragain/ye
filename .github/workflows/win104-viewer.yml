name: Windows 1.04 SDK Compatibility Build

on:
  push:
    branches:
      - agent/win104-image-viewer
    paths:
      - "win104-viewer/**"
      - ".github/workflows/win104-viewer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-win1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install native 8086 Windows 1.x compiler
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/ow-linux \
            https://github.com/open-watcom/open-watcom-v2/releases/download/Current-build/open-watcom-2_0-c-linux-x64
          mkdir -p "$HOME/watcom"
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          7z x -y -o"$HOME/watcom" /tmp/ow-linux >/dev/null
          chmod -R u+rx "$HOME/watcom/binl64" "$HOME/watcom/binl"

      - name: Compile Windows 1.01-SDK-style applications
        shell: bash
        run: |
          set -euxo pipefail
          export WATCOM="$HOME/watcom"
          export EDPATH="$WATCOM/eddat"
          export INCLUDE="$WATCOM/h;$WATCOM/h/win"
          export PATH="$WATCOM/binl64:$WATCOM/binl:$PATH"
          cd win104-viewer
          # 8086 Windows1, independent SS/DS, explicit callback DGROUP reload.
          # -s disables Watcom stack checker, which otherwise calls before
          # __loadds has restored DS in an exported Windows 1.x WndProc.
          flags="-bt=windows -ms -0 -zu -zw -bg -s -nt=_TEXT -dWINVER=0x0100 -wx -zq"
          wcc $flags -fo=sdkprobe.obj sdkprobe.c
          wcc $flags -fo=sdkviewer.obj sdkviewer.c
          wcc $flags -fo=minwin.obj minwin.c

          cat > sdkprobe.lnk <<'LINK'
          system windows1
          name SDKPROBE.EXE
          file sdkprobe.obj
          EXPORT SdkProbeProc.1 PRIVATE RESIDENT
          segment TYPE CODE MOVEABLE
          segment TYPE DATA MOVEABLE
          option stack=4096
          option heapsize=1024
          option map=SDKPROBE.MAP
          LINK
          wlink @sdkprobe.lnk

          cat > sdkviewer.lnk <<'LINK'
          system windows1
          name CHRONO.EXE
          file sdkviewer.obj
          EXPORT View104Proc.1 PRIVATE RESIDENT
          segment TYPE CODE MOVEABLE
          segment TYPE DATA MOVEABLE
          option stack=4096
          option heapsize=2048
          option map=CHRONO.MAP
          LINK
          wlink @sdkviewer.lnk

          cat > minwin.lnk <<'LINK'
          system windows1
          name MINWIN.EXE
          file minwin.obj
          segment TYPE CODE MOVEABLE
          segment TYPE DATA MOVEABLE
          option stack=4096
          option heapsize=1024
          option map=MINWIN.MAP
          LINK
          wlink @minwin.lnk

          file SDKPROBE.EXE CHRONO.EXE MINWIN.EXE
          ls -lh SDKPROBE.EXE CHRONO.EXE MINWIN.EXE

      - name: Verify Win1 module imports and NE formats
        run: |
          set -euo pipefail
          python3 win104-viewer/verify_ne.py win104-viewer/SDKPROBE.EXE
          python3 win104-viewer/verify_ne.py win104-viewer/CHRONO.EXE
          python3 win104-viewer/verify_ne.py win104-viewer/MINWIN.EXE

      - name: Make small 1985-compatible test picture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          w,h=96,64
          data=bytes((x//6+(y//8)*2)%16 for y in range(h) for x in range(w))
          Path("win104-viewer/IMAGE.CV1").write_bytes(
              b"CV1\x1a"+w.to_bytes(2,"little")+h.to_bytes(2,"little")+data)
          PY
          cat > win104-viewer/INSTALL.TXT <<'TXT'
          ChronoView Windows 1.04 main viewer: DGROUP repair build

          IMPORTANT: Make a clean snapshot and restart the guest from a
          cold power-off. Do not resume a RAM snapshot containing the crash.

          1. Launch CHRONO.EXE directly from MS-DOS Executive.
          2. Verify the title is "ChronoView". Move the window,
             wait, and move it again before loading any image.
          3. If it stays stable, press O to open C:\IMAGE.CV1.
             P: edit image path, Enter to open, Esc to cancel
             F: fit vs. actual size
             Q: exit
          4. Only if CHRONO crashes, test SDKPROBE.EXE to isolate
             bare window/GDI compatibility. MINWIN.EXE optionally
             checks Windows1 loader startup.
          5. PNG/JPEG/WebP require CV1 conversion using convert.html
             on your current phone/browser.

          Both GUI programs now use the 1985 Windows 1.01 SDK conventions:
          FAR PASCAL callback, zeroed LocalAlloc WNDCLASS,
          GetInstanceData for multiple running copies, no custom icon,
          no child windows, no startup disk writes, and no discardable code.

          GitHub verifies the linker and executable structure but an
          actual Windows 1.04 emulator boot/move test has not been done.
          TXT

      - uses: actions/upload-artifact@v4
        with:
          name: CHRONOVIEW-104-SDK-SAFE
          path: |
            win104-viewer/MINWIN.EXE
            win104-viewer/SDKPROBE.EXE
            win104-viewer/CHRONO.EXE
            win104-viewer/IMAGE.CV1
            win104-viewer/INSTALL.TXT
            win104-viewer/convert.html
            win104-viewer/SDKPROBE.MAP
            win104-viewer/CHRONO.MAP
          if-no-files-found: error
