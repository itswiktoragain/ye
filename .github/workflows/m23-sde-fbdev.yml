name: M23 SDE fbdev compile check

on:
  workflow_dispatch:
  push:
    branches: [agent/m23-debian-kernel]
    paths: ['.github/workflows/m23-sde-fbdev.yml']

permissions:
  contents: read

jobs:
  check-display:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Install compiler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev python3 python3-ply rsync cpio
      - name: Fetch pinned M23 kernel
        run: |
          git init kernel
          git -C kernel remote add origin https://github.com/Aflaungos/android_kernel_samsung_sm7225_testing.git
          git -C kernel fetch --depth=1 origin 0f84de3f1ba8b593faad9a4cac2cacb0915519c4
          git -C kernel checkout --detach FETCH_HEAD
      - name: Configure SDE with framebuffer console
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          args=(ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu-)
          make -C kernel O="$PWD/build" "${args[@]}" vendor/lineage-m23xq_defconfig
          kernel/scripts/config --file build/.config \
            --disable COMPAT_VDSO --disable FB_MSM --disable FB_MSM_MDSS --disable DRM_MSM \
            --enable DEVTMPFS --enable DEVTMPFS_MOUNT --enable VT --enable VT_CONSOLE \
            --enable FB --enable DRM --enable DRM_KMS_HELPER --enable DRM_FBDEV_EMULATION \
            --enable FRAMEBUFFER_CONSOLE --enable FONT_SUPPORT --enable FONT_8x16 \
            --disable FRAMEBUFFER_CONSOLE_DEFERRED_TAKEOVER
          make -C kernel O="$PWD/build" "${args[@]}" olddefconfig
          grep -qx 'CONFIG_DRM_FBDEV_EMULATION=y' build/.config
          grep -qx 'CONFIG_FRAMEBUFFER_CONSOLE=y' build/.config
          ! grep -Eq '^CONFIG_(FB_MSM|DRM_MSM)=[ym]$' build/.config
          grep -E 'CONFIG_(ARCH_LITO|DISPLAY_SAMSUNG|PANEL_NT36672C|DRM_FBDEV|FB_MSM|DRM_MSM|FRAMEBUFFER_CONSOLE)' build/.config
      - name: Compile existing SDE driver with fbdev enabled
        shell: bash
        run: |
          set -euo pipefail
          make -C kernel O="$PWD/build" ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- -j2 techpack/display/ 2>&1 | tee sde-build.log
          test -s build/techpack/display/msm/msm_fbdev.o
          test -s build/techpack/display/msm/msm_drv.o
          test -s build/techpack/display/msm/sde/sde_kms.o
          echo 'Affected SDE display objects compiled successfully.'
      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m23-sde-fbdev-compile-check
          path: |
            sde-build.log
            build/.config
          if-no-files-found: warn
