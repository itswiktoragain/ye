name: Publish Drive Nearby

on:
  push:
    branches:
      - drive-nearby-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Drive Nearby
        uses: actions/upload-pages-artifact@v3
        with:
          path: drive-nearby-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
