name: Armpaba ISO build
on:
  push:
    branches: [agent/armpaba]
    paths:
      - 'armpaba/**'
      - '.github/workflows/armpaba-iso.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build on Debian 13 (matches live-build target)
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:trixie bash -Eeuo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                live-build debootstrap squashfs-tools xorriso \
                grub-common grub2-common grub-pc-bin grub-efi-amd64-bin \
                mtools dosfstools ca-certificates python3
              bash -n armpaba/build-iso.sh armpaba/src/install.sh armpaba/src/xsession.sh
              python3 -m compileall -q armpaba/src
              python3 -m unittest discover -s armpaba/tests -v
              ARMPABA_BUILD_WORK=/work/armpaba/.work \
                ARMPABA_OUTPUT=/work/Armpaba-x86_64.iso \
                bash armpaba/build-iso.sh
              test -s Armpaba-x86_64.iso
              xorriso -indev Armpaba-x86_64.iso -report_el_torito plain | tee iso-boot-report.txt
              xorriso -indev Armpaba-x86_64.iso -ls /live | tee iso-files.txt
              grep -q filesystem.squashfs iso-files.txt
              grep -qi EFI iso-boot-report.txt
            '
      - name: Upload ISO
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Armpaba-x86_64-ISO
          path: |
            Armpaba-x86_64.iso
            Armpaba-x86_64.iso.sha256
            iso-boot-report.txt
          if-no-files-found: warn
          retention-days: 7
