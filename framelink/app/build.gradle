plugins {
    id 'com.android.application'
}
android {
    namespace 'dev.framelink.camera'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.framelink.camera'
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
